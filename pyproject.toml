[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-from-first-principles"
version = "0.1.0"
description = "Learning LLM inference through incremental experiments on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["modal>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["inference_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
